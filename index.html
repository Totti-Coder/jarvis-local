<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;500&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --vacio:#04070b;
  --cian:#56d9e8;
  --cian-tenue:#1c4d58;
  --ambar:#e6a44b;
  --texto:#a8c8d2;
  --acento:var(--cian);
}
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--vacio);
  color:var(--texto);
  font-family:'IBM Plex Mono',monospace;
  height:100vh;
  overflow:hidden;
  display:grid;
  grid-template-rows:auto 1fr auto;
  /* halo ambiental que sigue el color del estado */
  background-image:radial-gradient(ellipse at 50% 38%,
    color-mix(in srgb, var(--acento) 9%, transparent) 0%, transparent 62%);
  transition:background-image .6s ease;
}

/* ---------- barra superior ---------- */
.barra{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:18px 26px;
  border-bottom:1px solid rgba(86,217,232,.1);
  font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.28em;font-size:12px;
  color:var(--cian-tenue);
}
.barra b{color:var(--acento);font-weight:500;transition:color .4s}

.telemetria{display:flex;gap:22px;letter-spacing:.16em;font-size:11px}
.telemetria span::before{content:'';display:inline-block;
  width:5px;height:5px;border-radius:50%;
  background:var(--cian-tenue);margin-right:7px;vertical-align:middle}
.telemetria span.on::before{background:var(--acento);
  box-shadow:0 0 8px var(--acento)}

/* ---------- núcleo ---------- */
.nucleo{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:26px;min-height:0;
}
#escena{
  /* 52vh chocaba con el registro (34vh) y la pista quedaba tapada.
     Se limita también por el ancho para que no se salga en pantallas bajas. */
  width:min(40vh,38vw,360px);height:min(40vh,38vw,360px);
  /* el resplandor de fondo lo pone CSS: en 3D costaría un pase de bloom */
  filter:drop-shadow(0 0 18px color-mix(in srgb, var(--acento) 45%, transparent));
  transition:filter .5s ease;
}
#escena canvas{display:block;width:100%;height:100%}

.estado{
  font-family:'Barlow Condensed',sans-serif;
  font-size:15px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--acento);font-weight:300;transition:color .4s;
}

.pista{font-size:11px;color:var(--cian-tenue);letter-spacing:.12em}
kbd{border:1px solid var(--cian-tenue);border-radius:2px;
  padding:1px 6px;font-family:inherit;font-size:10px}

/* ---------- transcripción ---------- */
.registro{
  height:34vh;overflow-y:auto;
  padding:20px 26px 26px;
  border-top:1px solid rgba(86,217,232,.1);
  display:flex;flex-direction:column;gap:15px;
  scrollbar-width:thin;scrollbar-color:var(--cian-tenue) transparent;
}
.linea{max-width:76ch;font-size:14px;line-height:1.65;
  animation:entrar .35s ease both}
@keyframes entrar{from{opacity:0;transform:translateY(6px)}}

.linea .quien{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  display:block;margin-bottom:3px;
}
.tu .quien{color:var(--cian-tenue)}
.tu .dicho{color:#7e9aa4}
.ia .quien{color:var(--cian)}
.ia .dicho{color:#d4eef4}
.error .quien{color:#e06868}
.error .dicho{color:#c98a8a;font-style:italic}

/* respuestas que vienen de la agenda, no del modelo */
.etiqueta{
  font-style:normal;margin-left:10px;padding:1px 6px;
  border:1px solid var(--ambar);border-radius:2px;
  color:var(--ambar);font-size:9px;letter-spacing:.18em;
}
.desde-herramienta .dicho{color:#f0dcc0}
.provisional .dicho{color:#5c7a84;font-style:italic}
.provisional .dicho::after{
  content:'▌';margin-left:2px;animation:parpadeo 1s steps(2) infinite}
@keyframes parpadeo{50%{opacity:0}}

/* ---------- borrador de correo ----------
   Un correo dictado entero no se puede corregir hablando: si Whisper
   oye mal la direccion, repetirla en voz alta falla otra vez. Por eso
   antes de enviar nada se abre esto y se revisa con el teclado. */
.velo{
  position:fixed;inset:0;z-index:50;
  background:rgba(2,5,9,.82);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:aparecer .2s ease both;
}
@keyframes aparecer{from{opacity:0}}
.velo[hidden]{display:none}

.sobre{
  width:min(560px,100%);max-height:92vh;overflow-y:auto;
  background:#070d14;
  border:1px solid var(--cian-tenue);border-radius:4px;
  box-shadow:0 0 46px rgba(86,217,232,.13);
  padding:22px 24px 20px;
  display:flex;flex-direction:column;gap:14px;
}
.sobre h2{
  font-family:'Barlow Condensed',sans-serif;font-weight:500;
  font-size:13px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--ambar);
}
.campo{display:flex;flex-direction:column;gap:5px}
/* display:flex gana a [hidden], que solo vale display:none. Sin esto,
   ocultar el asunto y el mensaje en el primer paso no hacia nada. */
.campo[hidden]{display:none}
.campo label{
  font-family:'Barlow Condensed',sans-serif;
  font-size:10px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--cian-tenue);
}
.sobre input,.sobre textarea{
  font-family:'IBM Plex Mono',monospace;font-size:14px;
  background:#04080d;color:#d4eef4;
  border:1px solid rgba(86,217,232,.22);border-radius:3px;
  padding:9px 11px;width:100%;line-height:1.6;
}
.sobre input:focus,.sobre textarea:focus{
  outline:none;border-color:var(--acento);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--acento) 12%,transparent);
}
.sobre textarea{resize:vertical;min-height:150px}
.aviso{color:#e06868;font-size:12px;line-height:1.5}
.aviso[hidden]{display:none}

.botones{display:flex;gap:10px;justify-content:flex-end;margin-top:2px}
.sobre button{
  font-family:'Barlow Condensed',sans-serif;
  font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  padding:10px 20px;border-radius:3px;cursor:pointer;
  border:1px solid var(--cian-tenue);background:transparent;color:var(--texto);
  transition:border-color .2s,color .2s,background .2s;
}
.sobre button:hover{border-color:var(--acento);color:var(--acento)}
.sobre button.mandar{
  border-color:var(--ambar);color:var(--ambar);
  background:color-mix(in srgb,var(--ambar) 9%,transparent);
}
.sobre button.mandar:hover{background:color-mix(in srgb,var(--ambar) 20%,transparent)}
.sobre button[disabled]{opacity:.4;cursor:wait}
.truco{font-size:10px;color:var(--cian-tenue);letter-spacing:.1em;
  margin-right:auto;align-self:center}

/* ---------- accesibilidad ---------- */
:focus-visible{outline:2px solid var(--acento);outline-offset:4px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:600px){
  .telemetria{display:none}
  .registro{height:40vh;padding:16px}
  /* En el móvil el popup ocupa la pantalla: con el teclado abierto no
     queda sitio para adornos, y los botones tienen que ser tocables. */
  .velo{padding:0;align-items:stretch}
  .sobre{height:100dvh;max-height:none;border:none;border-radius:0;padding:18px 16px}
  /* el mensaje se come el hueco que sobra en vez de dejar medio movil vacio */
  .campo-mensaje{flex:1;min-height:0}
  .sobre textarea{height:100%;min-height:90px}
  .botones{margin-top:4px}
  .sobre button{flex:1;padding:14px 12px}
  .truco{display:none}
}
</style>
</head>
<body>

<header class="barra">
  <span>Jarvis · <b id="conexion">conectando</b></span>
  <nav class="telemetria" aria-label="Estado del sistema">
    <span id="t-oido">Oído</span>
    <span id="t-modelo">Modelo</span>
    <span id="t-voz">Voz</span>
  </nav>
</header>

<main class="nucleo">
  <!-- el núcleo 3D lo dibuja Three.js dentro de este contenedor -->
  <div id="escena" aria-hidden="true"></div>

  <p class="estado" id="estado">en reposo</p>
  <p class="pista">Pulsa <kbd>espacio</kbd> y habla. Se env&iacute;a solo al callar, o pulsa otra vez</p>
</main>

<section class="registro" id="registro" aria-live="polite"></section>

<!-- Borrador de correo. Sale cuando Jarvis propone enviar uno: se revisa
     con el teclado y se manda desde aqui, nunca solo de oido. -->
<div class="velo" id="velo" hidden>
  <form class="sobre" id="sobre" role="dialog" aria-modal="true"
        aria-labelledby="sobre-titulo">
    <h2 id="sobre-titulo">Revisa el correo antes de enviarlo</h2>

    <div class="campo">
      <label for="b-para">Para — un nombre de tu agenda o una direcci&oacute;n</label>
      <input id="b-para" list="b-agenda" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false"
             inputmode="email" placeholder="Ana  ·  ana@ejemplo.com">
      <datalist id="b-agenda"></datalist>
    </div>

    <div class="campo">
      <label for="b-asunto">Asunto</label>
      <input id="b-asunto" autocomplete="off">
    </div>

    <div class="campo campo-mensaje">
      <label for="b-mensaje">Mensaje</label>
      <textarea id="b-mensaje"></textarea>
    </div>

    <p class="aviso" id="b-aviso" hidden></p>

    <div class="botones">
      <span class="truco"><kbd>Esc</kbd> cancela</span>
      <button type="button" id="b-cancelar">Cancelar</button>
      <button type="submit" class="mandar" id="b-enviar">Enviar</button>
    </div>
  </form>
</div>

<script>
// Estado que el motor 3D necesita leer. Va en window porque el motor
// es un modulo ES y no comparte ambito con este script.
const J = window.JARVIS = {nivel: 0, bandas: [], estado: 'inactivo'};

/* ---------- registro de conversación ---------- */

function nuevaLinea(clase, quien, texto) {
  const reg = document.getElementById('registro');
  const div = document.createElement('div');
  div.className = 'linea ' + clase;
  div.innerHTML = `<span class="quien">${quien}</span>
                   <span class="dicho"></span>`;
  div.querySelector('.dicho').textContent = texto || '';
  reg.appendChild(div);
  reg.scrollTop = reg.scrollHeight;
  return div;
}

let provisional = null;   // la línea que se va escribiendo mientras hablas
let respuesta = null;     // la línea que crece token a token
let version = null;       // huella de la interfaz con la que se cargó esto

function fijarEstado(valor) {
  const mapa = {
    inactivo:      ['en reposo',    'var(--cian)',  []],
    escuchando:    ['escuchando',   'var(--cian)',  ['t-oido']],
    transcribiendo:['transcribiendo','var(--cian)', ['t-oido']],
    pensando:      ['pensando',     'var(--ambar)', ['t-modelo']],
    hablando:      ['hablando',     'var(--cian)',  ['t-modelo','t-voz']],
  };
  const [txt, color, luces] = mapa[valor] || mapa.inactivo;
  J.estado = valor;
  if (valor !== 'escuchando') J.bandas = [];  // el espectro es solo del micro
  if (valor === 'inactivo') J.nivel = 0;
  document.getElementById('estado').textContent = txt;
  document.documentElement.style.setProperty('--acento', color);
  ['t-oido','t-modelo','t-voz'].forEach(id =>
    document.getElementById(id).classList.toggle('on', luces.includes(id)));
}

/* ---------- conexión ---------- */

let sock = null;
let reintento = 0;

function conectar() {
  // wss:// cuando la pagina va por https. Una pagina segura NO puede abrir
  // un WebSocket inseguro: el navegador lo bloquea por contenido mixto, sin
  // avisar en la interfaz. Se deduce del protocolo en vez de fijarlo.
  const protocolo = location.protocol === 'https:' ? 'wss:' : 'ws:';
  sock = new WebSocket(`${protocolo}//${location.host}/ws`);
  sock.binaryType = 'arraybuffer';     // los trozos de voz llegan en binario

  sock.onopen = () => {
    reintento = 0;
    document.getElementById('conexion').textContent = 'en línea';
    // Solo una vez: reconectar no debe volver a pedir el permiso
    if (!micDisponible && puedeMicro()) prepararMicro();
    else if (micDisponible) sock.send(JSON.stringify({cmd: 'micro_navegador'}));
  };

  sock.onclose = () => {
    // Antes la página se quedaba muerta si el servidor se caía o se
    // reiniciaba, y había que recargar a mano. Ahora reintenta sola,
    // esperando cada vez un poco más, hasta un tope de 5 segundos.
    reintento++;
    const espera = Math.min(5000, 400 * reintento);
    document.getElementById('conexion').textContent =
      `reconectando (${reintento})`;
    document.getElementById('estado').textContent = 'sin servidor';
    J.nivel = 0;
    setTimeout(conectar, espera);
  };

  sock.onmessage = alMensaje;
}

const alMensaje = ev => {
  // Los trozos de voz llegan en binario por el mismo socket
  if (ev.data instanceof ArrayBuffer) { reproducirVoz(ev.data); return; }
  const m = JSON.parse(ev.data);

  if (m.tipo === 'nivel') {
    J.nivel = m.valor;
    if (m.bandas) J.bandas = m.bandas;
  }

  // Huella de la interfaz que sirve el servidor. Si cambia respecto a la
  // que hay cargada, esta pagina es vieja: al reiniciar el servidor el
  // socket reconecta solo, sin recargar, y la pestaña se queda con el JS
  // de antes. Los mensajes nuevos se ignoraban sin ningun error visible.
  else if (m.tipo === 'version') {
    if (version === null) version = m.valor;
    else if (version !== m.valor) {
      document.getElementById('conexion').textContent = 'actualizando';
      location.reload();
    }
  }

  else if (m.tipo === 'estado') {
    fijarEstado(m.valor);
    // Mandar audio solo mientras el servidor dice que escucha: el tambien
    // cierra la grabacion por su cuenta (corte por silencio, limite).
    const escuchaba = micActivo;
    micActivo = micDisponible && m.valor === 'escuchando';
    if (micActivo && !escuchaba) {
      // Acaba de abrir: primero va lo que se dijo mientras confirmaba
      for (const t of preBuffer) sock.send(t);
      preBuffer = [];
      micArmado = false;
    } else if (!micActivo) {
      preBuffer = [];
      micArmado = false;
    }
  }

  // Le han interrumpido: tirar lo que quede sonando en este aparato
  else if (m.tipo === 'voz_corta') callarVoz();

  else if (m.tipo === 'audio_navegador') {
    document.getElementById('t-oido').title = 'micrófono del navegador';
  }

  else if (m.tipo === 'parcial') {
    if (!provisional) provisional = nuevaLinea('tu provisional', 'Tú', '');
    provisional.querySelector('.dicho').textContent = m.texto;
    document.getElementById('registro').scrollTop = 1e6;
  }

  else if (m.tipo === 'usuario') {
    // la versión buena sustituye a la provisional
    if (!provisional) provisional = nuevaLinea('tu', 'Tú', '');
    provisional.className = 'linea tu';
    provisional.querySelector('.dicho').textContent = m.texto;
    provisional = null;
    respuesta = nuevaLinea('ia', 'Jarvis', '');
  }

  else if (m.tipo === 'token' && respuesta) {
    respuesta.querySelector('.dicho').textContent += m.texto;
    document.getElementById('registro').scrollTop = 1e6;
  }

  else if (m.tipo === 'fin_respuesta') respuesta = null;

  else if (m.tipo === 'descartar') {
    provisional?.remove();
    provisional = null;
  }

  else if (m.tipo === 'saludo') {
    // resumen del día al entrar: no lleva pregunta delante
    const l = nuevaLinea('ia desde-herramienta', 'Jarvis', m.texto);
    l.querySelector('.quien')
     .insertAdjacentHTML('beforeend', '<i class="etiqueta">tu agenda</i>');
  }

  else if (m.tipo === 'herramienta') {
    // marca la respuesta como venida de la agenda, no del modelo
    respuesta?.classList.add('desde-herramienta');
    respuesta?.querySelector('.quien')
             ?.insertAdjacentHTML('beforeend',
                `<i class="etiqueta">${m.nombre.replace(/_/g, ' ')}</i>`);
  }

  else if (m.tipo === 'error') {
    respuesta?.remove();
    respuesta = null;
    nuevaLinea('ia error', 'Jarvis', m.texto);
  }

  // frase suelta de Jarvis que no contesta a nada dicho (botones del popup)
  else if (m.tipo === 'dicho') {
    const l = nuevaLinea('ia desde-herramienta', 'Jarvis', m.texto);
    if (m.etiqueta)
      l.querySelector('.quien').insertAdjacentHTML('beforeend',
        `<i class="etiqueta">${m.etiqueta}</i>`);
  }

  else if (m.tipo === 'borrador')       abrirBorrador(m);
  else if (m.tipo === 'borrador_cerrar') cerrarBorrador();
  else if (m.tipo === 'borrador_error')  mostrarAviso(m.texto);
};

/* ---------- borrador de correo ---------- */

let modo = 'completo';    // 'destinatario' = solo se pide a quien va
const velo  = document.getElementById('velo');
const bPara = document.getElementById('b-para');
const bAsun = document.getElementById('b-asunto');
const bMsg  = document.getElementById('b-mensaje');
const bAviso= document.getElementById('b-aviso');
const bEnv  = document.getElementById('b-enviar');

function mostrarAviso(t) {
  bAviso.textContent = t || '';
  bAviso.hidden = !t;
  bEnv.disabled = false;
}

function abrirBorrador(m) {
  bPara.value = m.destinatario || '';
  bAsun.value = m.asunto || '';
  bMsg.value  = m.mensaje || '';
  mostrarAviso('');
  bEnv.disabled = false;

  // Dos modos. En "destinatario" solo se pide a quien va: es lo unico
  // que la voz no puede dar, porque una direccion mal oida no se
  // arregla repitiendola. El asunto y el texto los pregunta hablando.
  modo = m.modo || 'completo';
  const soloPara = modo === 'destinatario';
  bAsun.closest('.campo').hidden = soloPara;
  bMsg.closest('.campo').hidden  = soloPara;
  document.getElementById('sobre-titulo').textContent =
    soloPara ? '¿A quién se lo mando?' : 'Revisa el correo antes de enviarlo';
  bEnv.textContent = soloPara ? 'Continuar' : 'Enviar';

  // La agenda alimenta el desplegable, pero el campo es libre: se puede
  // teclear una direccion de alguien que no este en ella.
  document.getElementById('b-agenda').innerHTML =
    (m.contactos || []).map(c => {
      const o = document.createElement('option');
      o.value = c.nombre; o.label = c.email;
      return o.outerHTML;
    }).join('');

  velo.hidden = false;
  // Sin destinatario, el cursor va ahi: es lo que hay que arreglar.
  // Con destinatario, al final del mensaje, que es lo que se retoca.
  if (soloPara || !bPara.value) { bPara.focus(); }
  else { bMsg.focus(); bMsg.setSelectionRange(bMsg.value.length, bMsg.value.length); }
}

function cerrarBorrador() {
  velo.hidden = true;
  bEnv.disabled = false;
}

document.getElementById('sobre').addEventListener('submit', e => {
  e.preventDefault();
  if (!sock || sock.readyState !== WebSocket.OPEN) return;
  mostrarAviso('');
  bEnv.disabled = true;             // que un doble clic no mande dos correos

  if (modo === 'destinatario') {
    // Solo se manda a quien va; el servidor sigue preguntando por voz
    sock.send(JSON.stringify({
      cmd: 'borrador_destinatario',
      destinatario: bPara.value,
    }));
    return;
  }
  sock.send(JSON.stringify({
    cmd: 'borrador_enviar',
    destinatario: bPara.value,
    asunto: bAsun.value,
    mensaje: bMsg.value,
  }));
});

document.getElementById('b-cancelar').addEventListener('click', () => {
  cerrarBorrador();
  if (sock && sock.readyState === WebSocket.OPEN)
    sock.send(JSON.stringify({cmd: 'borrador_cancelar'}));
});

conectar();

/* ---------- control ---------- */

/* ---------- micrófono del navegador (móvil) ----------
   El micro del PC lo captura Python. Desde el móvil eso no sirve: hay que
   capturar aquí y mandar el PCM por el mismo WebSocket. Solo es posible en
   contexto seguro (https o localhost); si no, getUserMedia ni existe. */

let audioCtx = null, micNodo = null, micStream = null, micActivo = false;
let micArmado = false;      // pulsado, esperando a que el servidor abra
let preBuffer = [];         // lo dicho en ese hueco
let micDisponible = false;

function puedeMicro() {
  return window.isSecureContext && navigator.mediaDevices?.getUserMedia;
}

async function prepararMicro() {
  if (!puedeMicro()) return false;
  try {
    // Filtros DESACTIVADOS a propósito. En un PC dan igual, pero en
    // Android echoCancellation conmuta el micro al modo de llamada:
    // banda estrecha y compresión agresiva, pensado para que se te
    // entienda por teléfono, no para reconocimiento de voz. Y
    // noiseSuppression se come las consonantes sordas, que es justo lo
    // que distingue "casa" de "caza".
    //
    // Se pueden quitar porque grabar y hablar no se solapan nunca: es
    // por turnos, así que no hay eco del que defenderse.
    //
    // autoGainControl sí se deja: el móvil puede estar a un palmo o a
    // un metro, y eso son 20 dB de diferencia.
    micStream = await navigator.mediaDevices.getUserMedia({audio: {
      channelCount: 1,
      echoCancellation: false, noiseSuppression: false, autoGainControl: true,
    }});
  } catch (e) {
    console.warn('micrófono denegado:', e.name);
    return false;
  }

  // Se pide 16 kHz directamente; si el navegador lo ignora (iOS abre a
  // 48 kHz), el worklet remuestrea por su cuenta.
  audioCtx = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 16000});
  await audioCtx.audioWorklet.addModule('/static/captura.js');

  micNodo = new AudioWorkletNode(audioCtx, 'captura');
  // El nodo TIENE que llegar al destino o el grafo puede no bombearlo.
  // En Chrome de escritorio funciona igual, pero en el movil salia audio
  // a tirones o entrecortado. Va por un gain a cero: se procesa, pero no
  // se oye (si no, te oirias a ti mismo por el altavoz).
  const mudo = audioCtx.createGain();
  mudo.gain.value = 0;
  mudo.connect(audioCtx.destination);
  micNodo.port.onmessage = ev => {
    if (sock?.readyState !== WebSocket.OPEN) return;
    if (micActivo) { sock.send(ev.data); return; }
    // Armado pero el servidor aun no ha confirmado: se guarda en vez de
    // tirarlo. Entre que pulsas y llega "escuchando" hay una ida y vuelta
    // por wifi, y en ese hueco ya estas hablando: se perdian las primeras
    // silabas, que es justo lo que peor lleva Whisper.
    if (micArmado) {
      preBuffer.push(ev.data);
      if (preBuffer.length > 30) preBuffer.shift();   // ~2s de tope
    }
  };
  audioCtx.createMediaStreamSource(micStream).connect(micNodo);
  micNodo.connect(mudo);

  // Que negocio de verdad el movil, para poder mirarlo en el servidor en
  // vez de adivinar por que se entiende mal
  const pista = micStream.getAudioTracks()[0];
  const ajustes = pista?.getSettings?.() || {};
  console.log('micro:', audioCtx.sampleRate, 'Hz', ajustes);

  micDisponible = true;
  sock.send(JSON.stringify({
    cmd: 'micro_navegador',
    contexto_hz: audioCtx.sampleRate,
    ajustes: {
      hz: ajustes.sampleRate, canales: ajustes.channelCount,
      eco: ajustes.echoCancellation, ruido: ajustes.noiseSuppression,
      ganancia: ajustes.autoGainControl, aparato: ajustes.deviceId ? 'sí' : 'no',
    },
    agente: navigator.userAgent.slice(0, 90),
  }));
  document.querySelector('.pista').innerHTML =
    'Pulsa <kbd>el núcleo</kbd> y habla. Se env&iacute;a solo al callar';
  return true;
}

/* ---------- reproducir la voz que llega del servidor ----------
   Llega en trozos: 4 bytes de frecuencia y detrás el PCM en int16. Se
   encadenan en el tiempo para que no haya silencios ni solapes entre uno
   y el siguiente. */

let siguienteHueco = 0;
const sonando = new Set();

function reproducirVoz(datos) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const frecuencia = new DataView(datos).getUint32(0, true);
  const pcm = new Int16Array(datos, 4);
  const buffer = audioCtx.createBuffer(1, pcm.length, frecuencia);
  const canal = buffer.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) canal[i] = pcm[i] / 32768;

  const fuente = audioCtx.createBufferSource();
  fuente.buffer = buffer;
  fuente.connect(audioCtx.destination);

  // Encadenado: cada trozo empieza donde acabó el anterior, nunca antes
  // de "ahora". Sin esto se pisarían o dejarían huecos audibles.
  const ahora = audioCtx.currentTime;
  const empieza = Math.max(ahora, siguienteHueco);
  fuente.start(empieza);
  siguienteHueco = empieza + buffer.duration;

  sonando.add(fuente);
  fuente.onended = () => sonando.delete(fuente);
}

function callarVoz() {
  for (const f of sonando) { try { f.stop(); } catch (e) {} }
  sonando.clear();
  siguienteHueco = 0;
}

function alternar() {
  if (!sock || sock.readyState !== WebSocket.OPEN) return;
  // Los navegadores exigen un gesto del usuario para dejar sonar audio.
  // Esta pulsación es ese gesto.
  if (audioCtx?.state === 'suspended') audioCtx.resume();
  // Empezar a guardar YA, sin esperar a que el servidor conteste
  if (micDisponible && !micActivo) { micArmado = true; preBuffer = []; }
  sock.send(JSON.stringify({cmd: 'alternar'}));
}

addEventListener('keydown', e => {
  // Con el borrador abierto el teclado es para escribir, no para el micro:
  // cada espacio del mensaje habria disparado una grabacion.
  if (!velo.hidden) {
    if (e.key === 'Escape') document.getElementById('b-cancelar').click();
    // Ctrl+Enter manda sin soltar el teclado
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey))
      document.getElementById('sobre').requestSubmit();
    return;
  }
  const escribiendo = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
  if (e.code === 'Space' && !e.repeat && !escribiendo) {
    e.preventDefault(); alternar();
  }
});
document.querySelector('.nucleo').addEventListener('click', alternar);
</script>
