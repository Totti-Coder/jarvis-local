# Ejecuta la parte de la suite que no necesita GPU ni modelos.
#
# QUE CORRE Y QUE NO
#
# Un runner de GitHub no tiene GPU, ni Ollama, ni los 4,7 GB del modelo de
# lenguaje, ni los 137 MB de la voz. Asi que aqui corre la logica pura:
# el interprete de fechas en espanol, las franjas horarias, el resumen
# diario, los datos del usuario y el parseo MIME del correo.
#
# Son 122 de los 174 casos, y ninguno necesita instalar una sola
# dependencia: los modulos que tocan son stdlib, y los imports de Google
# estan dentro de las funciones a proposito.
#
# Lo que queda fuera (voz, router, cadena completa, audio del movil) se
# ejecuta en local con `python eval_router.py` y los demas test_*.py.
# Prometer aqui lo que el runner no puede probar seria peor que no tener CI.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # para poder lanzarlo a mano desde la web

jobs:
  logica:
    name: Lógica sin GPU
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fechas y horas habladas
        run: python test_memoria.py

      - name: Ambigüedad de "a las 8.40"
        run: python test_horas.py

      - name: Franjas, tramos y fines de semana
        run: python test_ventanas.py

      - name: Persistencia y resumen del día
        run: python test_resumen.py

      - name: Datos personales del usuario
        run: python test_datos.py

      - name: Correo — MIME, firmas, citas, fechas
        run: python test_correo.py

      - name: Agenda propia + Google Calendar, sin repetir
        run: python test_agenda_externa.py

      - name: Borrar por fecha, sin llevarse la agenda entera
        run: python test_borrar_fecha.py

      - name: Cronómetro — órdenes de voz y tiempo contado
        run: python test_cronometro.py

      - name: Guardia — nadie de fuera controla Jarvis
        run: python test_guardia.py

      - name: Horas por cliente — fichar, consultar, CSV
        run: python test_horas_cliente.py

      - name: Rutinas — solo pasos de una lista cerrada
        run: python test_rutinas.py

      - name: Temporizador — qué frase lo pone y cuál no
        run: python test_temporizador.py

      - name: Órdenes fijas — 72 frases, cronómetro · temporizador · horas · rutinas
        run: python eval_ordenes.py

      - name: El tiempo — Open-Meteo, sin red en el test
        run: python test_tiempo.py

      - name: Alucinaciones de Whisper — descartar lo que nadie dijo
        run: python test_filtro_voz.py

  dependencias:
    name: Dependencias sin vulnerabilidades conocidas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Todas las versiones estan fijadas en requirements.txt, asi que se
      # audita linea a linea (--no-deps) contra la base de avisos de
      # seguridad de Python. Sin esto, una vulnerabilidad conocida en una
      # dependencia entraria sin que nadie se enterase.
      - name: pip-audit
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --requirement requirements.txt --no-deps --strict

      - name: URLs seguras — nada de leer tu red local (SSRF)
        run: python test_url_segura.py

      - name: Copia diaria de la base de datos
        run: python test_respaldo.py
